<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinic Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">+</span> Clinic Portal</div>
    <div id="userbox" class="userbox" hidden>
      <span id="user-name" class="user-name"></span>
      <span id="user-role" class="role-badge"></span>
      <button id="logout-btn" class="btn small light" type="button">Log out</button>
    </div>
    <button id="menu-btn" class="menu-btn" type="button" aria-label="Menu" hidden>&#9776;</button>
  </header>

  <noscript><p class="alert error">This site needs JavaScript.</p></noscript>

  <!-- Login / register -->
  <section id="auth-view" class="auth-wrap" hidden>
    <div class="card auth-card">
      <div class="tabs">
        <button type="button" class="tab active" data-tab="login">Sign in</button>
        <button type="button" class="tab" data-tab="register">Register as patient</button>
      </div>
      <div id="auth-msg" class="alert" hidden></div>

      <form id="login-form" class="form" novalidate>
        <label class="field"><span>Email *</span><input type="email" name="email" autocomplete="username" required></label>
        <label class="field"><span>Password *</span><input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Sign in</button>
      </form>

      <form id="register-form" class="form" hidden novalidate>
        <div class="grid2">
          <label class="field"><span>First name *</span><input name="firstName" required></label>
          <label class="field"><span>Last name *</span><input name="lastName" required></label>
          <label class="field"><span>Personal number *</span><input name="personalNumber" required></label>
          <label class="field"><span>Phone *</span><input name="phone" type="tel" required></label>
          <label class="field"><span>Birth date *</span><input name="birthDate" type="date" required></label>
          <label class="field"><span>Email *</span><input name="email" type="email" autocomplete="email" required></label>
        </div>
        <label class="field"><span>Password *</span><input name="password" type="password" autocomplete="new-password" required></label>
        <button class="btn" type="submit">Create my account</button>
      </form>
    </div>
  </section>

  <!-- Signed-in area -->
  <div id="app-view" class="app" hidden>
    <nav id="nav" class="sidenav" aria-label="Main"></nav>
    <main id="view" class="main"></main>
  </div>

  <!-- Pop-up window used for forms and details -->
  <dialog id="modal" class="modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button type="button" class="btn small ghost" data-close aria-label="Close">&#10005;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
